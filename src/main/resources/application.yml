logging:
  level:
    root: WARN
    br.com.home.automateservice: INFO
  pattern:
    console: '%msg%n'
    file: '%msg%n'

server:
  port: 8080

app:
  kafka:
    topic: automate-events-dev
  redis:
    fallback:
      # Teto da fila de retry; ao atingir, novos eventos vão direto para a DLQ (home-assistant-events:dlq).
      max-queue-size: 100000
      # Reenvios por evento antes de movê-lo para a DLQ.
      max-attempts: 10
      # TTL da key da fila e idade máxima de um evento contada desde a 1ª falha.
      retention: 24h
      # Eventos retidos na DLQ; os mais antigos são descartados ao exceder.
      dlq-max-size: 10000

spring:
  kafka:
    bootstrap-servers: kafka-bootstrap.home.lab:9092, 192.168.1.211:9092
    properties[spring.kafka.bootstrap-servers]: kafka-bootstrap.home.lab:9092, 192.168.1.211:9092

    producer:
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      batch-size: 16384
      retries: 3
      linger-ms: 5
      request-timeout-ms: 15000
      properties:
        schema:
          registry:
            url: http://192.168.1.225:8081
        auto:
          register:
            schemas: true
  redis:
    redisson:
      file: classpath:redisson.yml