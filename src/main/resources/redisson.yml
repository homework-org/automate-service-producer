singleServerConfig:
  idleConnectionTimeout: 10000
  connectTimeout: 10000
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500
  password: null
  subscriptionsPerConnection: 5
  clientName: null
  address: "redis://192.168.1.212:6379"
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 50
  connectionMinimumIdleSize: 10
  connectionPoolSize: 64
  database: 0
  dnsMonitoringInterval: 5000
  # O EqualJitterDelay padrão do Redisson 3.50.0 estoura long na 57ª tentativa de
  # reconexão e mata o watchdog: após uma queda longa do Redis o pool fica com canais
  # fechados para sempre ("Unable to write command into connection"). Corrigido no 4.1.0.
  reconnectionDelay: !<org.redisson.config.DecorrelatedJitterDelay> {baseDelay: PT0.1S, maxDelay: PT10S}
threads: 0
nettyThreads: 0
codec: !<org.redisson.codec.JsonJacksonCodec> {}